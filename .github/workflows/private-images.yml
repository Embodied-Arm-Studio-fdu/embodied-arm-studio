name: Private A-7 images
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: private-a7-images
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: api
            dockerfile: docker/api.Dockerfile
          - role: web
            dockerfile: docker/web.Dockerfile
          - role: simulation
            dockerfile: deploy/simulation.Dockerfile
          - role: worker
            dockerfile: deploy/worker.Dockerfile
    env:
      SOURCE_SHA: 24dc21aa1bfc181a2749b6a4dca8a60a28b31aeb
      IMAGE_TAG: a7-20261022-24dc21aa1bfc
      GH_TOKEN: ${{ github.token }}
      ROLE: ${{ matrix.role }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 24dc21aa1bfc181a2749b6a4dca8a60a28b31aeb
          persist-credentials: false
      - name: Verify private repository and package policy
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          gh api "repos/$GITHUB_REPOSITORY" --jq '.private' | grep -qx true
          package="embodied-arm-studio-a7-$ROLE"
          image="ghcr.io/embodied-arm-studio-fdu/$package"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          echo "PACKAGE=$package" >> "$GITHUB_ENV"
          code=$(curl -sS -o "$RUNNER_TEMP/package-before.json" -w '%{http_code}'             -H "Authorization: Bearer $GH_TOKEN"             "https://api.github.com/orgs/Embodied-Arm-Studio-fdu/packages/container/$package")
          if [ "$code" = 200 ]; then
            jq -e '.visibility == "private"' "$RUNNER_TEMP/package-before.json"
            gh api --paginate "orgs/Embodied-Arm-Studio-fdu/packages/container/$package/versions" > "$RUNNER_TEMP/versions.json"
            jq -e --arg tag "$IMAGE_TAG" 'all(.[]; (.metadata.container.tags | index($tag)) == null)' "$RUNNER_TEMP/versions.json"
          else
            test "$code" = 404
          fi
          df -h /
      - name: Authenticate to private GHCR
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build exact approved source without SDK or runtime mounts
        run: |
          docker build --platform linux/amd64             --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY"             --label "org.opencontainers.image.revision=$SOURCE_SHA"             --label "org.opencontainers.image.version=$IMAGE_TAG"             --file '${{ matrix.dockerfile }}' --tag "$IMAGE:$IMAGE_TAG" .
      - name: Push private image and record actual registry identity
        shell: bash
        run: |
          set -euo pipefail
          docker push "$IMAGE:$IMAGE_TAG"
          digest=$(docker buildx imagetools inspect "$IMAGE:$IMAGE_TAG" --format '{{.Manifest.Digest}}')
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          docker image inspect "$IMAGE:$IMAGE_TAG" > "$RUNNER_TEMP/image-inspect.json"
          gh api "orgs/Embodied-Arm-Studio-fdu/packages/container/$PACKAGE" > "$RUNNER_TEMP/package-after.json"
          jq -e --arg repo "$GITHUB_REPOSITORY" '.visibility == "private" and .repository.full_name == $repo' "$RUNNER_TEMP/package-after.json"
          mkdir -p evidence
          jq -n --arg role "$ROLE" --arg image "$IMAGE" --arg tag "$IMAGE_TAG"             --arg digest "$digest" --arg sha "$SOURCE_SHA"             --arg run "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"             --slurpfile inspect "$RUNNER_TEMP/image-inspect.json"             --slurpfile package "$RUNNER_TEMP/package-after.json"             '{role:$role,reference:($image+"@"+$digest),tag:($image+":"+$tag),source_sha:$sha,platform:"linux/amd64",run:$run,visibility:$package[0].visibility,repository:$package[0].repository.full_name,image_id:$inspect[0][0].Id,labels:$inspect[0][0].Config.Labels}'             > "evidence/$ROLE.json"
          cat "evidence/$ROLE.json"
      - uses: actions/upload-artifact@v4
        with:
          name: private-image-${{ matrix.role }}
          path: evidence/*.json
          if-no-files-found: error
      - name: Clear ephemeral registry credentials
        if: always()
        run: docker logout ghcr.io
