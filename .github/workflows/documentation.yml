name: Documentation and delivery files
on:
  push:
    paths:
      - 'README*'
      - 'NOTICE.md'
      - 'THIRD_PARTY_NOTICES.md'
      - 'docs/**'
      - 'scripts/check_public_docs.py'
      - 'scripts/export_release.py'
      - '.github/workflows/documentation.yml'
      - '.github/workflows/self-hosting.yml'
  pull_request:
    paths:
      - 'README*'
      - 'NOTICE.md'
      - 'THIRD_PARTY_NOTICES.md'
      - 'docs/**'
      - 'scripts/check_public_docs.py'
      - 'scripts/export_release.py'
      - '.github/workflows/documentation.yml'
      - '.github/workflows/self-hosting.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-documentation:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check bilingual entry points and delivery file selection
        run: python scripts/check_public_docs.py
