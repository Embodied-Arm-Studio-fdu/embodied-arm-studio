map $http_upgrade $studio_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 5173;
    server_name _;
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $studio_connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://api:8000;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $studio_connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Resolve media at request time so web also starts in deployments without media.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location ^~ /media-whep/ {
        set $studio_whep http://media:18889;
        rewrite ^/media-whep/(.*)$ /$1 break;
        proxy_pass $studio_whep;
        proxy_http_version 1.1;
        proxy_set_header Origin "";
        proxy_buffering off;
        proxy_read_timeout 60s;
        proxy_redirect ~^https?://[^/]+(/.*)$ /media-whep$1;
        proxy_redirect ~^(/.*)$ /media-whep$1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}